services:
  db:
    image: postgres:17
    container_name: ayzek_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env icinde POSTGRES_PASSWORD tanimli degil}
      POSTGRES_DB: ayzek_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  ayzek-backend:
    build: ./BACKEND
    container_name: ayzek_backend_cont
    depends_on:
      - db
    environment:
      # Gizli değerler (JWT_SECRET_KEY, R2_*) .env dosyasından gelir
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@db:5432/ayzek_db
      ALLOWED_ORIGINS: "https://ayzek22.com.tr,https://www.ayzek22.com.tr"
    env_file:
      - .env
    volumes:
      # Yüklenen orijinal resimler kaybolmasın diye:
      - ./BACKEND/public/uploads:/app/public/uploads
    # Dışarı port açılmıyor; trafik nginx üzerinden geliyor
    restart: always

  ayzek-frontend:
    build:
      context: ./FRONTEND
      args:
        NEXT_PUBLIC_API_BASE: https://api.ayzek22.com.tr
    container_name: ayzek_frontend_cont
    depends_on:
      - ayzek-backend
    environment:
      NEXT_PUBLIC_API_BASE: "https://api.ayzek22.com.tr"
      NEXT_PUBLIC_API_URL: "https://api.ayzek22.com.tr"
      NEXT_PUBLIC_BACKEND_URL: "https://api.ayzek22.com.tr"
    volumes:
      # 👇 İŞTE HIZI SAĞLAYACAK OLAN EKLENTİ BU! 👇
      # Next.js'in oluşturduğu cache ve optimize resimler silinmeyecek.
      - nextjs_cache:/app/.next/cache
    restart: always

  nginx:
    image: nginx:alpine
    container_name: ayzek_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/ssl/ayzek:/etc/ssl/ayzek:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - ayzek-frontend
      - ayzek-backend
    restart: always

volumes:
  postgres_data:
  # 👇 BUNU DA EKLEMELİSİN
  nextjs_cache:

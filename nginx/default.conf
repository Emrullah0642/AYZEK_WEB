# --------------------------------------------------------
# PERFORMANS: GZIP SIKIŞTIRMA (Siteyi Hızlandırır)
# --------------------------------------------------------
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied expired no-cache no-store private auth;
gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
gzip_disable "MSIE [1-6]\.";

# --------------------------------------------------------
# 1. BÖLÜM: HTTP -> HTTPS YÖNLENDİRMESİ
# --------------------------------------------------------
server {
    listen 80;
    server_name ayzek.tr www.ayzek.tr api.ayzek.tr;
    return 301 https://$host$request_uri;
}

# --------------------------------------------------------
# 2. BÖLÜM: FRONTEND (HTTPS - Site & Next.js Image)
# --------------------------------------------------------
server {
    listen 443 ssl;
    server_name ayzek.tr www.ayzek.tr;

    # Sertifika Yolları
    ssl_certificate /etc/ssl/ayzek/origin.pem;
    ssl_certificate_key /etc/ssl/ayzek/origin.key;

    # Güvenlik Ayarları
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        client_max_body_size 100M;

        # 👇 502 HATASINI ÇÖZEN KISIM BURASI 👇
        # Next.js resim işlerken Nginx bağlantıyı kesmesin diye süre uzatıyoruz.
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        proxy_pass http://ayzek-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# --------------------------------------------------------
# 3. BÖLÜM: BACKEND API (HTTPS - Veri & Upload)
# --------------------------------------------------------
server {
    listen 443 ssl;
    server_name api.ayzek.tr;

    # Sertifika Yolları
    ssl_certificate /etc/ssl/ayzek/origin.pem;
    ssl_certificate_key /etc/ssl/ayzek/origin.key;

    location / {
        client_max_body_size 100M;

        # Upload Hızlandırıcılar
        proxy_http_version 1.1;
        proxy_request_buffering off; 
        proxy_buffering off;

        # API Timeout Ayarları
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        proxy_pass http://ayzek-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


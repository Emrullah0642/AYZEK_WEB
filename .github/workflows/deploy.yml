name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sunucuya deploy et
        uses: appleboy/ssh-action@v1
        with:
          host: 213.128.79.6
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/ayzek
            git remote set-url origin https://github.com/sadikbilal/AYZEK_WEB.git
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            docker image prune -f
            docker compose ps
